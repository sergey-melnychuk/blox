# Log rotation for the journal, which holds the relay's and Caddy's logs (DEPLOY.md).
# Install as /etc/systemd/journald.conf.d/blox.conf, then `systemctl restart systemd-journald`.
# It applies to the whole journal on the host.
[Journal]
Storage=persistent
# At most 500 MB on disk, always 1 GB free, nothing older than 14 days.
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=14day
# One file per day, so whole days expire.
MaxFileSec=1day
