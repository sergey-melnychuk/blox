[package]
name = "blox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
blox-client = { version = "0.1.0", path = "../blox-client" }
blox-evm = { version = "0.1.0", path = "../blox-evm" }
blox-proto = { version = "0.1.0", path = "../blox-proto" }
clap = { version = "4.6.7", features = ["derive", "env"] }
gethostname = "1.1.0"
qrcode = "0.14.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
alloy-primitives = "1.7.3"
axum = "0.8.9"
blox-mock-keystore = { path = "../blox-mock-keystore" }
blox-relay = { path = "../blox-relay" }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }

[[bin]]
name = "blox"
path = "src/main.rs"
