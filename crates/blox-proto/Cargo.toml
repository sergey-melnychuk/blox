[package]
name = "blox-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"
