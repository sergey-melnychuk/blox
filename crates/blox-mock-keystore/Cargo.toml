[package]
name = "blox-mock-keystore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blox-client = { version = "0.1.0", path = "../blox-client" }
blox-proto = { version = "0.1.0", path = "../blox-proto" }
