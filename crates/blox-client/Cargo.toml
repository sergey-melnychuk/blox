[package]
name = "blox-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blox-evm = { version = "0.1.0", path = "../blox-evm" }
blox-proto = { version = "0.1.0", path = "../blox-proto" }
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
qrcode = "0.14.1"
tokio = { version = "1.53.1", features = ["full"] }
