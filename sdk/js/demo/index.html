<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blox demo</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #111; --muted: #666; --card: #fff; --line: #ddd; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --card: #1b1b1b; --line: #333; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      button { font: inherit; padding: 8px 14px; margin: 8px 8px 0 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: inherit; cursor: pointer; }
      #account { font-family: ui-monospace, monospace; }
      #log { font: 13px/1.6 ui-monospace, monospace; color: var(--muted); word-break: break-all; }
      #log a { color: inherit; text-decoration: none; }
      .on { display: none; }
      body.connected .on { display: block; }
      body.connected .off { display: none; }
      body.connected #disconnect { display: inline-block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Blox demo</h1>
      <section>
        <span id="account"></span>
        <div>
          <button id="connect" class="off">Connect</button>
          <button id="disconnect" class="on">Disconnect</button>
        </div>
      </section>
      <section class="on">
        <input id="to" placeholder="To (empty: yourself)" spellcheck="false" />
        <input id="amount" value="0.0001" inputmode="decimal" />
        <button id="send">Send</button>
        <button id="sign">Sign message</button>
        <button id="typed">Sign typed data</button>
      </section>
      <div id="log"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
